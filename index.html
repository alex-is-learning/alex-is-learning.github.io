<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex is Learning</title>
  <meta name="description" content="Alex — personal site and notebook." />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap');

    :root {
      --bg: #fff2d1;
      --text: #000;
      --muted: #222;
    }

    body {
      margin: 0;
      font-family: 'Spectral', Georgia, 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 56px 20px;
    }
    main { max-width: 680px; margin: 0 auto; }

    h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; letter-spacing: 0; }
    h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.05; margin: 0 0 16px; }
    p { font-size: clamp(17px, 2.2vw, 19px); margin: 0 0 14px; }

    nav { margin-top: 22px; }
    nav a { display: inline-block; margin-right: 18px; color: var(--text); text-decoration: none; border-bottom: 1px solid transparent; }
    nav a:hover { border-color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Alex is Learning</h1>
    <p>Hello — I’m Alex!</p>
    <p>I am a beginner artist, at 29 casting off the STEM life I fell into by mistake and starting fresh</p>
    <img src="image.jpg" alt="Alex" style="max-width:100%;height:auto;display:block;margin-bottom:18px;">

    <nav>
      <a href="https://substack.com/@alexislearning">Substack</a>
      <a href="https://x.com/alexislearning">Twitter</a>
      <a href="https://www.alexislearning.me/scrapbook">Scrapbook</a>
      <a href="mailto:alexiscreatingthings@gmail.com">Email</a>
    </nav>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>

</body>
</html>
